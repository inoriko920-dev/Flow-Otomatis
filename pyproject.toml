[project]
name = "flow-otomatis"
version = "0.0.0"
description = "Windows desktop foundation for deterministic Google Flow scene orchestration."
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Flow-Otomatis Project" }]
dependencies = [
  "PySide6==6.11.2",
  "playwright==1.63.0",
  "pydantic==2.13.5",
  "keyring==25.7.0",
]

[project.scripts]
flow-otomatis = "flow_otomatis.bootstrap.main:main"

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "pyinstaller==6.22.3",
  "pytest==9.1.1",
  "pytest-qt==4.5.0",
  "ruff==0.16.10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_otomatis"]

[tool.uv]
required-version = ">=0.12.23,<0.13"

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
qt_api = "pyside6"
