name: One-off final repository backup package (Flow-Otomatis only)
on:
  push:
    branches:
      - backup/oneoff-export-20261011-wib
    paths:
      - .github/workflows/backup-oneoff-export.yml
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated backup-tools branch
        uses: actions/checkout@v4
        with:
          ref: backup/oneoff-export-20261011-wib
          persist-credentials: false
      - name: Build and verify self-contained repository backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python backup_tools/build_final_backup.py
      - name: Upload one complete ZIP payload
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Otomatis-FULL-BACKUP-2026-10-11-WIB
          path: final/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
