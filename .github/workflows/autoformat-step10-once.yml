name: STEP10 Autoformat Once

on:
  push:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  UV_LINK_MODE: "copy"

jobs:
  format:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Apply formatter
        run: uv run ruff format .

      - name: Commit formatter result
        shell: pwsh
        run: |
          if (git status --porcelain) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "autoformat: STEP 10 [skip ci]"
            git push
          } else {
            Write-Host "No formatting changes."
          }
