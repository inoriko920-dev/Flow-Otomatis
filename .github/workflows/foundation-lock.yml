name: Foundation Lock

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".python-version"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/foundation-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundation-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-and-verify:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Resolve lockfile
        run: uv lock

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/flow_otomatis

      - name: Architecture guard
        run: uv run python scripts/check_architecture.py

      - name: Unit and contract tests
        run: uv run pytest -q tests/unit tests/contract

      - name: Commit uv.lock if changed
        shell: pwsh
        run: |
          if (git status --porcelain -- uv.lock) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore(deps): lock foundation dependencies"
            git push origin HEAD:main
          } else {
            Write-Host "uv.lock already up to date."
          }
