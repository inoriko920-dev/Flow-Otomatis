name: Foundation Lock (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"
  UV_LINK_MODE: "copy"

jobs:
  verify-lock:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Verify frozen environment
        run: uv sync --frozen --all-groups

      - name: Run foundation quality gates
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src/flow_otomatis
          uv run python scripts/check_architecture.py
          uv run pytest -q tests/unit tests/contract
