name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"
  UV_LINK_MODE: "copy"

jobs:
  quality:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/flow_otomatis

      - name: Architecture guard
        run: uv run python scripts/check_architecture.py

      - name: Unit, contract, integration, smoke and UI tests
        run: >
          uv run pytest -q
          tests/unit
          tests/contract
          tests/integration
          tests/smoke
          tests/ui

  ui-visual:
    needs: quality
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Capture 30 ACTUAL UI states
        run: uv run python scripts/capture_ui_reference_suite.py artifacts/ui_actual

      - name: Compare ACTUAL vs frozen REFERENCE
        run: >
          uv run python scripts/compare_ui_references.py
          --actual-dir artifacts/ui_actual
          --reference-dir artifacts/ui_reference
          --report artifacts/ui_visual_report.md
          --minimum-similarity 0.55

      - name: Upload UI visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Otomatis-step12-i12-01-restart-proof-ui-evidence
          path: |
            artifacts/ui_actual
            artifacts/ui_reference
            artifacts/ui_visual_report.md
          if-no-files-found: warn
          retention-days: 14

  package-windows:
    needs: [quality, ui-visual]
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Stage Playwright Chromium
        run: uv run python scripts/stage_browsers.py .runtime/browsers

      - name: Smoke staged Chromium
        run: uv run python scripts/smoke_browser_runtime.py .runtime/browsers

      - name: Build portable onedir ZIP
        run: uv run python scripts/build_portable.py --browser-source .runtime/browsers

      - name: Portable smoke
        run: uv run python scripts/smoke_portable.py dist/Flow-Otomatis

      - name: Verify release ZIP source, checksum, CRC and Windows paths
        run: >
          uv run python scripts/verify_portable_artifact.py
          dist/Flow-Otomatis-portable-win-x64.zip
          --checksum-file dist/SHA256SUMS.txt
          --expected-git-sha "$env:GITHUB_SHA"

      - name: Upload portable STEP 12 I12-01 restart-proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Otomatis-step12-i12-01-restart-proof-win-x64
          path: |
            dist/Flow-Otomatis-portable-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14


  offline-simulator-windows:
    needs: quality
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Exercise synthetic offline allocation CLI
        shell: pwsh
        run: |
          uv run python scripts/offline_credit_simulator.py docs/examples/OFFLINE_SIMULATOR_DEMO.json --output offline-demo-result.json
          if ($LASTEXITCODE -ne 0) { throw "Offline simulator returned nonzero" }
          $data = Get-Content offline-demo-result.json -Raw | ConvertFrom-Json
          if ($data.mode -ne 'OFFLINE_SIMULATION' -or $data.live_dispatch_allowed -ne $false) {
            throw "Offline-only dispatch invariant failed"
          }
          if ($data.total_simulated_credits -ne 27 -or $data.assigned.Count -ne 2 -or $data.blocked.Count -ne 1) {
            throw "Synthetic sample results changed unexpectedly"
          }

      - name: Package separate standalone simulator GUI
        run: >
          uv run python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name Flow-Otomatis-Offline-Simulator
          --distpath dist/offline-simulator
          --workpath build/offline-simulator
          --specpath build/offline-simulator-spec
          scripts/offline_credit_simulator_ui.py

      - name: Verify executable and report presence
        shell: pwsh
        run: |
          if (!(Test-Path "dist/offline-simulator/Flow-Otomatis-Offline-Simulator.exe")) {
            throw "Standalone offline simulator Windows EXE missing"
          }
          if (!(Test-Path "offline-demo-result.json")) { throw "Synthetic output missing" }

      - name: Upload new standalone Windows simulator
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Otomatis-OFFLINE-Simulator-Win11-x64
          path: |
            dist/offline-simulator/Flow-Otomatis-Offline-Simulator.exe
            offline-demo-result.json
            docs/examples/OFFLINE_SIMULATOR_DEMO.json
          if-no-files-found: error
          retention-days: 14


  uix22-qt-windows:
    needs: quality
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Render all 22 real Qt states
        run: uv run python scripts/capture_credit_uix.py artifacts/e12_uix22

      - name: Verify 22 screenshot files
        shell: pwsh
        run: |
          $screens = @(Get-ChildItem -Path artifacts/e12_uix22 -Filter 'UIX-*.png')
          if ($screens.Count -ne 22) { throw "Expected exactly 22 UI renders" }

      - name: Fetch 22 approved frozen PNGs for read-only comparison
        shell: pwsh
        run: |
          git fetch --depth=1 origin refs/heads/docs/e12-02-uix-prompt-only-20261008
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch approved reference branch" }
          git worktree add --detach .ci-approved-ui FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot checkout read-only reference worktree" }

      - name: Verify 22 immutable owner-approved image checksums
        run: >
          uv run python scripts/verify_approved_uix_assets.py
          .ci-approved-ui/docs/ui/final/assets

      - name: Make 22 side-by-side visual QA sheets
        run: >
          uv run python scripts/audit_credit_uix_visual.py
          .ci-approved-ui/docs/ui/final/assets
          artifacts/e12_uix22
          artifacts/uix_review

      - name: Build separate UI preview EXE
        run: >
          uv run python -m PyInstaller
          --noconfirm --clean --onefile --windowed
          --name Flow-Otomatis-UIX22-Offline-Preview
          --distpath dist/uix22
          --workpath build/uix22
          --specpath build/uix22-spec
          --add-data ".ci-approved-ui/docs/ui/final/assets;approved_ui"
          scripts/credit_uix_preview.py

      - name: Check UI preview EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/uix22/Flow-Otomatis-UIX22-Offline-Preview.exe")) {
            throw "UIX22 Windows EXE missing"
          }

      - name: Upload UI preview executable and captures
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Otomatis-UIX22-Offline-Win11-x64
          path: |
            dist/uix22/Flow-Otomatis-UIX22-Offline-Preview.exe
            artifacts/e12_uix22
            artifacts/uix_review
          if-no-files-found: error
          retention-days: 14
