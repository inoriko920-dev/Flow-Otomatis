name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: "offscreen"
  UV_LINK_MODE: "copy"

jobs:
  quality:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src/flow_otomatis

      - name: Architecture guard
        run: uv run python scripts/check_architecture.py

      - name: Unit, contract and smoke tests
        run: uv run pytest -q tests/unit tests/contract tests/smoke

  package-windows:
    needs: quality
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: "x64"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv==0.12.23"

      - name: Sync locked environment
        run: uv sync --frozen --all-groups

      - name: Stage Playwright Chromium
        run: uv run python scripts/stage_browsers.py .runtime/browsers

      - name: Smoke staged Chromium
        run: uv run python scripts/smoke_browser_runtime.py .runtime/browsers

      - name: Generate third-party notice inventory
        run: uv run python scripts/generate_third_party_notices.py dist/THIRD_PARTY_NOTICES.txt

      - name: Build portable onedir ZIP
        run: uv run python scripts/build_portable.py --browser-source .runtime/browsers

      - name: Portable smoke
        run: uv run python scripts/smoke_portable.py dist/Flow-Otomatis

      - name: Upload portable foundation artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Otomatis-foundation-win-x64
          path: |
            dist/Flow-Otomatis-portable-win-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
